name: Deploy Supabase

# Antes disso, o deploy do backend (Supabase) era feito manualmente pela
# integração do Lovable. Desde que o repositório foi desvinculado do Lovable,
# esse é o único caminho de deploy para migrations e edge functions.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref hxfzgjxwozzuzgdsrrpb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: supabase functions deploy --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
