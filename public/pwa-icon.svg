<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(168, 80%, 42%)"/>
      <stop offset="100%" stop-color="hsl(262, 83%, 62%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="76%" cy="82%" r="65%">
      <stop offset="0%" stop-color="hsl(222, 47%, 6%)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="hsl(222, 47%, 6%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="hsl(222, 47%, 6%)" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- Lucide "pill" glyph (24x24 source), centered + scaled, filled solid -->
  <g transform="translate(256,256) scale(12) translate(-12,-12)" filter="url(#shadow)">
    <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" fill="#ffffff"/>
    <path d="m8.5 8.5 7 7" stroke="hsl(222, 47%, 6%)" stroke-width="0.85" stroke-linecap="butt" opacity="0.4"/>
  </g>
</svg>
